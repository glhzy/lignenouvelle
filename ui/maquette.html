<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonorisation du décor</title>
<style>
@font-face{font-family:"PoliceSNCF";src:url(../fonts/PoliceSNCF.woff) format("woff");font-weight:400;font-style:normal}
@font-face{font-family:"Univers LT Std";src:url(../fonts/UniversLTStd55.woff) format("woff");font-weight:400;font-style:normal}
body{margin:0;background:#E4E1D8}
*{box-sizing:border-box}
.pg{max-width:480px;margin:0 auto;background:#F4F1E8;font-family:"Univers LT Std",Univers,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400;color:#14203A;padding-bottom:28px}
.hd{background:#1B2A49;color:#fff;padding:20px 18px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hd small{display:block;font-family:"PoliceSNCF",Arial,sans-serif;font-size:18px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:#F2A65A}
.hd h1{margin:4px 0 0;font-family:"PoliceSNCF",Arial,sans-serif;font-size:44px;line-height:1;font-weight:400;letter-spacing:.02em;text-transform:uppercase}
.wf{border:2px solid #fff;padding:6px 8px;font-size:13px;font-weight:400;line-height:1.2;text-align:center;white-space:nowrap}
.st{height:8px;background:#D8D5CA}
.st i{display:block;height:8px;width:62%}
.bd{padding:18px 16px 0}
.vol{display:block;font-family:"PoliceSNCF",Arial,sans-serif;font-size:20px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.vol b{float:right;letter-spacing:0}
.rg{width:100%;height:44px;margin:0;accent-color:#E8761A}
.stop{width:100%;min-height:56px;border:0;background:#C8102E;color:#fff;font:400 24px "PoliceSNCF","Univers LT Std",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 4px}
.stop span{width:16px;height:16px;background:#fff;display:block}
.sec{margin-top:22px}
.sh{display:flex;align-items:center;gap:12px;background:#1B2A49;color:#fff;padding:0 14px 0 0;min-height:44px}
.sh em{font-style:normal;font-family:"PoliceSNCF",Arial,sans-serif;font-weight:400;font-size:30px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;color:#1B2A49;border:2px solid #1B2A49}
.sh h2{margin:0;font-family:"PoliceSNCF",Arial,sans-serif;font-size:22px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.t{min-height:64px;border:2px solid #1B2A49;background:#fff;color:#14203A;font:400 17px/1.15 "Univers LT Std",Univers,"Helvetica Neue",Helvetica,Arial,sans-serif;text-align:left;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.t.w{grid-column:1 / 3;min-height:56px;flex-direction:row;align-items:center}
.t:after{content:"";width:0;height:0;border-left:11px solid #1B2A49;border-top:7px solid transparent;border-bottom:7px solid transparent;align-self:flex-end}
.t.w:after{align-self:center}
.t.on{background:#E8761A;color:#14203A}
.t small{font-family:"PoliceSNCF",Arial,sans-serif;font-size:16px;font-weight:400;letter-spacing:.08em;text-transform:uppercase}
.ft{margin:22px 16px 0;padding-top:10px;border-top:2px solid #14203A;font-size:12px;display:flex;justify-content:space-between;color:#3A4560}
</style>
</head>
<body>
<div class="pg">
<div class="hd">
<div><h1 style="font-size: 24px">La ligne nouvelle</h1></div>
<div class="wf">Wi-Fi<br>lignenouvelle.local</div>
</div>
<div class="st"><i style="background: #E8761A"></i></div>
<div class="bd">
<label class="vol" for="vol">Volume <b>70 %</b></label>
<input class="rg" id="vol" type="range" min="0" max="100" value="70">
<button class="stop" type="button"><span></span>Arrêt général</button>

<div class="sec">
<div class="sh"><em>1</em><h2 style="font-size: 18px">Klaxons et sifflet</h2></div>
<div class="gr">
<button class="t" type="button">Klaxon long</button>
<button class="t" type="button">Klaxon court</button>
<button class="t" type="button">Klaxon bitonal</button>
<button class="t" type="button">Sifflet chef de gare</button>
</div>
</div>

<div class="sec">
<div class="sh"><em>2</em><h2 style="font-size: 18px">Annonces en gare</h2></div>
<div class="gr">
<button class="t w" type="button">Annonce Corail Marseille</button>
<button class="t w" type="button">Annonce Corail, jingle</button>
<button class="t w" type="button">Annonce TEE Mistral</button>
</div>
</div>

<div class="sec">
<div class="sh"><em>3</em><h2 style="font-size: 18px">Portes et freins</h2></div>
<div class="gr">
<button class="t" type="button">Porte de cabine</button>
<button class="t" type="button">Porte salle des machines</button>
<button class="t" type="button">Essai des freins</button>
<button class="t" type="button">Frein à main</button>
</div>
</div>

<div class="sec">
<div class="sh"><em>4</em><h2 style="font-size: 18px">Ambiances en boucle</h2></div>
<div class="gr">
<button class="t on" style="background: #E8761A" type="button"><small>En cours</small>Compresseur</button>
<button class="t" type="button">Purge d'air</button>
<button class="t" type="button">Pantographe</button>
<button class="t" type="button">Signal KVB</button>
</div>
</div>

<div class="ft"><span>ESP32-S3 · en ligne</span><span>5 sons chargés</span></div>
</div>
</div>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lignenouvelle · Démo audio</title>
<style>
@font-face{font-family:"PoliceSNCF";src:url('/fonts/PoliceSNCF.woff') format('woff')}
@font-face{font-family:"Univers LT Std";src:url('/fonts/UniversLTStd55.woff') format('woff')}

:root{
  --bleu:#1B2A49; --papier:#F4F1E8; --gris:#D8D5CA;
  --orange:#E8761A; --rouge:#C8102E; --encre:#14203A;
  --c-trac:#5C6BC0; --c-roul:#7B4F2E; --c-bord:#2D7D46; --c-sign:#C8102E; --c-ann:#E8761A;
}
*{box-sizing:border-box}
body{margin:0;background:#E4E1D8}
.pg{max-width:480px;margin:0 auto;background:var(--papier);
    font-family:"Univers LT Std",Univers,"Helvetica Neue",Arial,sans-serif;
    color:var(--encre);padding-bottom:32px}

/* ── En-tête ── */
.hd{background:var(--bleu);color:#fff;padding:18px 18px 14px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hd-left small{display:block;font-family:"PoliceSNCF";font-size:12px;
               letter-spacing:.12em;text-transform:uppercase;color:#F2A65A;margin-bottom:4px}
.hd-left h1{margin:0;font-family:"PoliceSNCF";font-size:24px;font-weight:400;
            letter-spacing:.03em;text-transform:uppercase;line-height:1}
.demo-badge{font-family:"PoliceSNCF";font-size:10px;letter-spacing:.08em;
            color:#F2A65A;white-space:nowrap;text-transform:uppercase;
            border:1px solid rgba(242,166,90,.4);padding:3px 6px;border-radius:2px;
            flex-shrink:0;align-self:flex-start;margin-top:2px}

/* ── Carousel locos ── */
.loco-carousel{display:flex;overflow-x:auto;
               scroll-snap-type:x mandatory;gap:8px;padding:10px 0 12px;
               scrollbar-width:none;margin-top:10px}
.loco-carousel::-webkit-scrollbar{display:none}
.loco-card{flex:0 0 148px;width:148px;scroll-snap-align:center;background:#fff;
           border:2px solid transparent;border-radius:4px;
           padding:5px 7px 3px;cursor:pointer;text-align:center;
           -webkit-tap-highlight-color:transparent;user-select:none;
           transition:border-color .12s;
           display:flex;flex-direction:column;justify-content:flex-end}
.loco-card.active{border-color:var(--bleu);background:var(--bleu)}
.loco-card.active .lc-name{color:#fff}
.loco-card img{display:block;width:100%;height:76px;object-fit:contain;image-rendering:pixelated}
.loco-card .lc-name{font-family:"PoliceSNCF";font-size:9px;letter-spacing:.05em;
                    text-transform:uppercase;color:var(--encre);margin-top:3px;
                    white-space:nowrap}
.loco-card[data-type="vapeur"]     {border-color:#7B4F2E}
.loco-card[data-type="diesel"]     {border-color:#B87800}
.loco-card[data-type="électrique"] {border-color:#2D67A8}
.loco-card[data-type="tgv"]        {border-color:#E8761A}
.loco-card[data-type="vapeur"]     .lc-name{color:#7B4F2E}
.loco-card[data-type="diesel"]     .lc-name{color:#B87800}
.loco-card[data-type="électrique"] .lc-name{color:#2D67A8}
.loco-card[data-type="tgv"]        .lc-name{color:#E8761A}
.car-sep{flex:0 0 2px;align-self:stretch;margin:6px 0;border-radius:1px;
         background:var(--gc,#888);opacity:.55}
.stripe{height:8px;background:var(--orange)}

/* ── Corps ── */
.bd{padding:18px 16px 0}
.vol-lbl{display:block;font-family:"PoliceSNCF";font-size:16px;letter-spacing:.06em;
         text-transform:uppercase;margin-bottom:4px}
.vol-lbl b{float:right;letter-spacing:0}
.rg{width:100%;height:44px;accent-color:var(--orange);margin:0 0 2px;cursor:pointer}
.stop-btn{width:100%;min-height:54px;border:0;background:var(--rouge);color:#fff;
          font:400 20px "PoliceSNCF",sans-serif;letter-spacing:.06em;text-transform:uppercase;
          display:flex;align-items:center;justify-content:center;gap:12px;
          margin:8px 0 4px;cursor:pointer}
.stop-btn span{width:14px;height:14px;background:#fff;display:block;flex-shrink:0}

/* ── Sections ── */
.sec{margin-top:22px}
.sh{display:flex;align-items:center;background:var(--bleu);color:#fff;
    padding:0 14px 0 0;min-height:44px}
.sh em{font-style:normal;font-family:"PoliceSNCF";font-size:26px;
       width:44px;height:44px;display:flex;align-items:center;justify-content:center;
       background:#fff;color:var(--bleu);flex-shrink:0}
.sh h2{margin:0 0 0 12px;font-family:"PoliceSNCF";font-size:16px;font-weight:400;
       letter-spacing:.06em;text-transform:uppercase}
.sec-traction  .sh em{background:var(--c-trac);color:#fff}
.sec-roulement .sh em{background:var(--c-roul);color:#fff}
.sec-bord      .sh em{background:var(--c-bord);color:#fff}
.sec-signaux   .sh em{background:var(--c-sign);color:#fff}
.sec-annonce   .sh em{background:var(--c-ann); color:#fff}
.gr{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}

/* ── Tuile bouton ── */
.t{min-height:64px;border:2px solid var(--bleu);background:#fff;color:var(--encre);
   font:400 14px/1.2 "Univers LT Std",sans-serif;text-align:left;
   padding:9px 10px 8px;display:flex;flex-direction:column;
   justify-content:center;gap:4px;
   cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;
   transition:background .12s}
.t.w{min-height:64px;flex-direction:row;
     align-items:center;gap:10px;padding:0 12px;justify-content:flex-start;
     flex-wrap:wrap;align-content:center}
.arr{width:0;height:0;
     border-left:11px solid var(--bleu);
     border-top:7px solid transparent;
     border-bottom:7px solid transparent;
     flex-shrink:0;margin-left:auto}
.t.on .arr{border-left-color:var(--encre)}
.t.on{background:var(--orange)}
.t.busy{opacity:.65}
.t.busy .arr{display:none}

/* ── Barre de séquence ── */
.seq-bar{display:none;align-items:center;gap:3px;margin-top:2px;flex-wrap:wrap;overflow:visible}
.t.w .seq-bar{flex-basis:100%;margin:4px 0 6px;justify-content:flex-start;flex-wrap:wrap}
.step{height:20px;border-radius:2px;display:flex;align-items:center;justify-content:center;
      font-family:"PoliceSNCF";font-size:10px;letter-spacing:.03em;white-space:nowrap;
      border:1.5px solid rgba(20,32,58,.35);background:rgba(255,255,255,.25);
      color:rgba(20,32,58,.7);padding:0 4px;flex-shrink:0;transition:all .12s}
.step.type-once{min-width:16px;padding:0 3px}
.step.type-loop{min-width:28px}
.step.cur{background:#fff;color:var(--encre);border-color:var(--encre);
          font-size:11px;box-shadow:0 0 0 1px var(--encre)}
.step.past{background:rgba(20,32,58,.18);border-color:rgba(20,32,58,.25);
           color:rgba(20,32,58,.45)}
.step.future{background:transparent;border-color:rgba(20,32,58,.2);color:rgba(20,32,58,.3)}
.step-sep{width:4px;height:1.5px;background:rgba(20,32,58,.2);flex-shrink:0}
.step.past + .step-sep{background:rgba(20,32,58,.18)}

/* ── Pied de page ── */
.ft{margin:22px 16px 0;padding-top:10px;border-top:2px solid var(--gris);
    font-size:12px;display:flex;justify-content:space-between;color:#3A4560}
.placeholder{padding:2.5rem 16px;text-align:center;color:#999;font-size:14px}
</style>
</head>
<body>
<div class="pg">

<div class="hd">
  <div class="hd-left">
    <small id="hd-sub">Lignenouvelle</small>
    <h1>Séquences sonores</h1>
  </div>
  <span class="demo-badge">● Démo audio</span>
</div>
<div class="stripe"></div>

<div class="bd">
  <label class="vol-lbl" for="vol">Volume <b id="vol-val">70 %</b></label>
  <input class="rg" type="range" id="vol" min="0" max="100" value="70">
  <button class="stop-btn" id="btn-stop"><span></span>Arrêt général</button>

  <div class="loco-carousel" id="loco-carousel"></div>

  <div id="secs-wrap">
    <div class="placeholder">Chargement…</div>
  </div>

  <div class="ft">
    <span id="ft-loco">—</span>
    <span id="ft-status">En attente</span>
  </div>
</div>

</div><!-- .pg -->

<script>
'use strict';

// ─── Couche Web Audio API ─────────────────────────────────────────────────────
class AudioLayer {
  constructor() {
    this.ctx     = null;
    this.buffers = new Map();   // url → AudioBuffer
    this.voices  = new Map();   // seqId → {src, gain}
    this._vol    = 0.49;        // 70% quadratique
  }

  _ctx() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }

  setVolume(pct) {
    this._vol = Math.pow(pct / 100, 2);
    this.voices.forEach(v => { v.gain.gain.value = this._vol; });
  }

  async _load(url) {
    if (this.buffers.has(url)) return;
    try {
      const r   = await fetch(url);
      if (!r.ok) return;
      const ab  = await r.arrayBuffer();
      const buf = await this._ctx().decodeAudioData(ab);
      this.buffers.set(url, buf);
    } catch(_) {}
  }

  async preload(locoId, seqs) {
    const urls = new Set();
    for (const s of seqs)
      for (const e of (s.etapes || []))
        if (e.son) urls.add(_wav(locoId, e.son));
    return Promise.all([...urls].map(u => this._load(u)));
  }

  async play(seqId, locoId, step, onEnded) {
    this.stop(seqId);
    const url = _wav(locoId, step.son);
    // Charge si pas encore en cache (clic avant fin du préchargement)
    if (!this.buffers.has(url)) await this._load(url);
    const buf = this.buffers.get(url);
    if (!buf) { if (onEnded) onEnded(); return; }  // son introuvable → avance quand même
    const ctx  = this._ctx();
    const gain = ctx.createGain();
    gain.gain.value = this._vol;
    gain.connect(ctx.destination);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop   = (step.type === 'loop');
    src.connect(gain);
    if (!src.loop && onEnded)
      src.onended = () => { if (this.voices.has(seqId)) onEnded(); };
    src.start();
    this.voices.set(seqId, {src, gain});
  }

  stop(seqId) {
    const v = this.voices.get(seqId);
    if (!v) return;
    try { v.src.onended = null; v.src.stop(); } catch(_) {}
    this.voices.delete(seqId);
  }

  stopAll() {
    [...this.voices.keys()].forEach(id => this.stop(id));
  }
}

function _wav(locoId, son) {
  const f = son.endsWith('.wav') ? son : son + '.wav';
  return `/sounds/${locoId}/${f}`;
}

const audioLayer = new AudioLayer();

// ─── Globals ──────────────────────────────────────────────────────────────────
const SECTIONS = [
  {id:'traction',   label:'Traction',               num:1},
  {id:'roulement',  label:'Roulement et crissement', num:2},
  {id:'bord',       label:'Équipements de bord',     num:3},
  {id:'signaux',    label:'Signaux et klaxons',      num:4},
  {id:'annonce',    label:'Annonces en gare',        num:5},
];

let currentVoie   = 1;
let currentLocoId = '';
let players       = {};
let pollTimer     = null;

// ─── Utilitaires REST ─────────────────────────────────────────────────────────
async function apiPost(url) { return fetch(url,{method:'POST'}).catch(()=>null); }
async function fetchJSON(url) { return fetch(url).then(r=>{ if(!r.ok)throw r; return r.json(); }); }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── SeqPlayer ────────────────────────────────────────────────────────────────
class SeqPlayer {
  constructor(id, seqDef, btn) {
    this.id    = id;
    this.seq   = seqDef;
    this.btn   = btn;
    this.state = "stopped";
    this.step  = 0;
    this._buildBar();
    btn.addEventListener("click", () => this.press());
  }

  press() {
    if      (this.state === "stopped") this._start();
    else if (this.state === "looping") this._advance();
  }

  _start() {
    apiPost(`/api/seq?voie=${currentVoie}&id=${encodeURIComponent(this.id)}`);
    this.step  = 0;
    const e    = this.seq.etapes[0];
    this.state = e ? (e.type === "loop" ? "looping" : "once") : "stopped";
    this._ui();
    if (e) audioLayer.play(this.id, currentLocoId, e,
           this.state === "once" ? () => this._autoAdv() : null);
  }

  _advance() {
    apiPost(`/api/seq/next?voie=${currentVoie}&id=${encodeURIComponent(this.id)}`);
    this._nextStep();
  }

  // Appelé automatiquement quand une étape "once" se termine
  _autoAdv() {
    if (this.state !== "once") return;
    this._nextStep();
  }

  _nextStep() {
    this.step++;
    if (this.step >= this.seq.etapes.length) {
      this.state = "stopped"; this.step = 0;
      audioLayer.stop(this.id);
    } else {
      const e    = this.seq.etapes[this.step];
      this.state = e.type === "loop" ? "looping" : "once";
      audioLayer.play(this.id, currentLocoId, e,
        this.state === "once" ? () => this._autoAdv() : null);
    }
    this._ui();
  }

  _forceDone() {
    this.state = "stopped"; this.step = 0;
    audioLayer.stop(this.id);
    this._ui();
  }

  syncFrom(_seqInfo) { /* no-op — le demo player est autoritaire */ }

  _buildBar() {
    const bar = this.btn.querySelector(".seq-bar");
    if (!bar) return;
    const frags = [];
    this.seq.etapes.forEach((e, i) => {
      if (i > 0) frags.push('<span class="step-sep"></span>');
      frags.push(`<span class="step type-${e.type} future" data-i="${i}">${escHtml(e.lbl)}</span>`);
    });
    bar.innerHTML = frags.join("");
  }

  _syncBar() {
    const bar = this.btn.querySelector(".seq-bar");
    if (!bar) return;
    bar.querySelectorAll(".step").forEach(el => {
      const i = +el.dataset.i;
      el.classList.remove("cur","past","future");
      if      (i === this.step) el.classList.add("cur");
      else if (i <  this.step)  el.classList.add("past");
      else                      el.classList.add("future");
    });
  }

  _ui() {
    const btn = this.btn;
    const bar = btn.querySelector(".seq-bar");
    const arr = btn.querySelector(".arr");
    btn.classList.remove("on","busy");
    if (this.state === "stopped") {
      if (bar) bar.style.display = "none";
      if (arr) arr.style.display = "";
    } else {
      if (bar) { bar.style.display = "flex"; this._syncBar(); }
      if (arr) arr.style.display = "none";
      btn.classList.add("on");
      if (this.state === "once" || this.state === "stopping")
        btn.classList.add("busy");
    }
    _updateFooter();
  }
}

// ─── Carousel locos ───────────────────────────────────────────────────────────
const GROUP_ORDER = ['vapeur','diesel','électrique','tgv'];
const GROUP_COLOR = {vapeur:'#7B4F2E',diesel:'#B87800','électrique':'#2D67A8',tgv:'#E8761A'};
function locoType(l){ return l.id==='TGV' ? 'tgv' : (l.type||'électrique'); }

function buildCarousel(locos, activeId) {
  const car = document.getElementById("loco-carousel");
  car.innerHTML = "";
  const sorted = [...locos].sort((a,b) =>
    GROUP_ORDER.indexOf(locoType(a)) - GROUP_ORDER.indexOf(locoType(b)));
  let prevGrp = null;
  sorted.forEach(loco => {
    const grp = locoType(loco);
    if (prevGrp !== null && grp !== prevGrp) {
      const sep = document.createElement("div");
      sep.className = "car-sep";
      sep.style.setProperty("--gc", GROUP_COLOR[grp]);
      car.appendChild(sep);
    }
    prevGrp = grp;
    const card = document.createElement("div");
    card.className = "loco-card" + (loco.id === activeId ? " active" : "");
    card.dataset.id   = loco.id;
    card.dataset.type = grp;
    card.innerHTML =
      `<img src="/img/locos/${loco.id}.gif" alt="${escHtml(loco.nom||loco.id)}" onerror="this.style.display='none'">` +
      `<div class="lc-name">${escHtml(loco.nom||loco.id)}</div>`;
    card.addEventListener("click", () => {
      if (card.classList.contains("active")) return;
      const l2 = locos.find(l => l.id === loco.id);
      if (l2) loadLoco(l2, true);
    });
    car.appendChild(card);
  });
  const active = car.querySelector(".active");
  if (active) active.scrollIntoView({inline:"center",behavior:"instant"});
}

function setActiveCard(locoId) {
  const car = document.getElementById("loco-carousel");
  if (!car) return;
  car.querySelectorAll(".loco-card").forEach(c =>
    c.classList.toggle("active", c.dataset.id === locoId));
  const active = car.querySelector(".active");
  if (active) active.scrollIntoView({inline:"center",behavior:"smooth"});
}

function _updateFooter() {
  const active = Object.values(players)
    .filter(p => p.state !== "stopped")
    .map(p => p.seq.label);
  document.getElementById("ft-status").textContent =
    active.length ? active.join(" · ") : "En attente";
}

// ─── Chargement séquences ─────────────────────────────────────────────────────
async function loadSeqs(loco) {
  let seqs = await fetchJSON(`/sounds/${loco.id}/sons_player.json`).catch(() => null);
  if (seqs && Array.isArray(seqs) && seqs.length) return seqs;
  const flat = await fetchJSON(`/sounds/${loco.id}/sons.json`).catch(() => []);
  return flat
    .filter(s => s.disponible !== false && s.type !== 'sequence')
    .map(s => ({
      id:     s.id,
      label:  s.label || s.id,
      groupe: s.groupe || '',
      etapes: [{
        son:  s.id,
        type: s.boucle ? 'loop' : 'once',
        lbl:  s.boucle ? '↺' : 'ANON'
      }]
    }));
}

// ─── Rendu ────────────────────────────────────────────────────────────────────
function renderSections(seqs, locoId) {
  const wrap = document.getElementById("secs-wrap");
  wrap.innerHTML = "";
  SECTIONS.forEach(sec => {
    const list = seqs.filter(s => s.groupe === sec.id);
    if (!list.length) return;
    const secEl = document.createElement("div");
    secEl.className = `sec sec-${sec.id}`;
    secEl.innerHTML =
      `<div class="sh"><em>${sec.num}</em><h2>${escHtml(sec.label)}</h2></div>` +
      `<div class="gr"></div>`;
    const gr = secEl.querySelector(".gr");
    list.forEach(seqDef => {
      const multi = seqDef.etapes.length > 1;
      const btn   = document.createElement("button");
      btn.className = multi ? "t w" : "t";
      btn.innerHTML =
        `<span class="lbl">${escHtml(seqDef.label)}</span>` +
        `<div class="seq-bar"></div>` +
        `<span class="arr"></span>`;
      gr.appendChild(btn);
      players[seqDef.id] = new SeqPlayer(seqDef.id, seqDef, btn);
    });
    wrap.appendChild(secEl);
  });
  document.getElementById("ft-loco").textContent = `${seqs.length} sons · ${locoId}`;
}

// ─── Polling état ─────────────────────────────────────────────────────────────
async function syncState() {
  const st = await fetchJSON('/api/state').catch(() => null);
  if (!st) return;
  // Le demo player est autoritaire pour les séquences audio.
  // On synchronise uniquement le volume (changé depuis un autre onglet).
  const srv = st.volume ?? null;
  if (srv !== null) {
    const el = document.getElementById("vol");
    if (Math.abs(+el.value - srv) > 1) {
      el.value = srv;
      document.getElementById("vol-val").textContent = `${srv} %`;
      audioLayer.setVolume(srv);
    }
  }
}

// ─── Chargement loco ──────────────────────────────────────────────────────────
async function loadLoco(loco, changeFirmware) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  players = {};
  audioLayer.stopAll();
  currentLocoId = loco.id;

  document.getElementById("secs-wrap").innerHTML =
    '<div class="placeholder">Chargement…</div>';
  setActiveCard(loco.id);

  if (changeFirmware) {
    await apiPost('/api/stop');
    await apiPost(`/api/loco?voie=${currentVoie}&id=${encodeURIComponent(loco.id)}`);
  }

  const seqs = await loadSeqs(loco);
  renderSections(seqs, loco.id);

  // Précharge les WAV en arrière-plan
  document.getElementById("ft-status").textContent = "Chargement sons…";
  audioLayer.preload(loco.id, seqs).then(() => {
    if (Object.values(players).every(p => p.state === "stopped"))
      document.getElementById("ft-status").textContent = "En attente";
  });

  pollTimer = setInterval(syncState, 2000);
  syncState();
}

// ─── Volume ───────────────────────────────────────────────────────────────────
let volDebounce = null;
document.getElementById("vol").addEventListener("input", function() {
  document.getElementById("vol-val").textContent = `${this.value} %`;
  audioLayer.setVolume(+this.value);
  clearTimeout(volDebounce);
  volDebounce = setTimeout(() => apiPost(`/api/volume?v=${this.value}`), 150);
});

// ─── Arrêt général ────────────────────────────────────────────────────────────
document.getElementById("btn-stop").addEventListener("click", () => {
  apiPost('/api/stop');
  audioLayer.stopAll();
  Object.values(players).forEach(p => { p.state = "stopped"; p.step = 0; p._ui(); });
});

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  const [st, allLocos] = await Promise.all([
    fetchJSON('/api/state').catch(() => null),
    fetchJSON('/api/locos').catch(() => []),
  ]);
  if (st?.volume != null) {
    document.getElementById("vol").value = st.volume;
    document.getElementById("vol-val").textContent = `${st.volume} %`;
    audioLayer.setVolume(st.volume);
  }
  const locos   = allLocos.filter(l => l.disponible !== false);
  const curId   = st?.voie1?.loco;
  const curLoco = locos.find(l => l.id === curId);
  buildCarousel(locos, curId);
  if (curLoco) await loadLoco(curLoco, false);
}

init();
</script>
</body>
</html>

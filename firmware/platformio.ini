; Lignenouvelle — boîtier sonore Wi-Fi pour décor ferroviaire
; Carte : ESP32-S3-DevKitC-1 N16R8 (16 Mo flash QIO, 8 Mo PSRAM OPI)
; Ampli : MAX98357A (I2S) — BCLK=GPIO5(blanc)  WS=GPIO6(bleu)  DOUT=GPIO4(rouge)
;
; Avant la première utilisation :
;   1. python3 tools/prepare_fs.py          (assemble firmware/data/)
;   2. pio run -t uploadfs                  (flashe LittleFS)
;   3. pio run -t upload                    (flashe le programme)
;   4. pio device monitor                   (observe la console)

[env:lignenouvelle]
platform  = espressif32
; ESP32-S3 N16R8 : variante qio_opi + BOARD_HAS_PSRAM (d'après 4d_systems board)
board     = 4d_systems_esp32s3_gen4_r8n16
framework = arduino

; Désactiver CDC on boot → Serial sur UART0 → USB-JTAG-Serial (même port que les messages IDF)
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags   = -DARDUINO_USB_CDC_ON_BOOT=0

; Partition table et filesystem (override celle du board)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

upload_speed   = 921600
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, default

; Dépendances
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
